name: "Packaging Test"

on:
  push:
    branches: [main]
  pull_request: {}
jobs:
  check_packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up uv and Python 3.15
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.15"
      - name: Run Packaging Test
        run: |
          uv build
          uv publish --dry-run
