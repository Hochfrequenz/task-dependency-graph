name: "Coverage"

on:
  push:
    branches: [main]
  pull_request: {}
jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up uv and Python 3.14
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"
      - name: Run Tests and Record Coverage
        working-directory: unittests
        run: |
          uv run --group coverage coverage run -m pytest
          uv run --group coverage coverage html --omit .venv/*,unittests/*
          uv run --group coverage coverage report --fail-under 95 --omit .venv/*,unittests/*
