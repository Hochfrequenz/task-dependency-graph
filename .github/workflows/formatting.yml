name: "Formatting"

on:
  push:
    branches: [main]
  pull_request: {}
jobs:
  # The "black"/"isort" matrix values and the job id are kept as-is even though both now run ruff,
  # because "black (black)" and "black (isort)" are required status checks in branch protection.
  # Renaming them requires updating that required-check list in the same change, which is an
  # admin-level, org-visible action - not done silently here.
  black:
    name: "black (${{ matrix.tool }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - tool: black
            command: "ruff format --check ."
          - tool: isort
            command: "ruff check --select I ."
    steps:
      - uses: actions/checkout@v6
      - name: Set up uv and Python 3.14
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"
      - name: ${{ matrix.tool }} Code Formatter
        run: |
          uv run --group linting ${{ matrix.command }}
