name: "Linting"

on:
  push:
    branches: [main]
  pull_request: {}
jobs:
  pylint:
    name: Python Code Quality and Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        linter-env: ["linting", "type_check", "spell_check"]
    steps:
      - uses: actions/checkout@v6
      - name: Set up uv and Python 3.14
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"
      - name: Run ruff check
        if: matrix.linter-env == 'linting'
        run: |
          uv run --group linting ruff check src/taskdependencygraph unittests
          # add single files (ending with .py) or packages here
      - name: Run mypy
        if: matrix.linter-env == 'type_check'
        run: |
          uv run --group type_check mypy --show-error-codes src/taskdependencygraph --strict
          uv run --group type_check mypy --show-error-codes unittests --strict
          # add single files (ending with .py) or packages here
      - name: Run codespell
        if: matrix.linter-env == 'spell_check'
        run: |
          uv run --group spell_check codespell --ignore-words=domain-specific-terms.txt src
          uv run --group spell_check codespell --ignore-words=domain-specific-terms.txt README.md
          # add single files (ending with .py) or packages here
