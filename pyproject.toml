[project]
name = "taskdependencygraph"
description = "Wrapper around a NetworkX Digraph to model and visualize tasks/todos, their duration and interdependencies"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Hochfrequenz Unternehmensberatung GmbH", email = "info+github@hochfrequenz.de" }]
keywords = ["networkx", "kroki", "graph", "digraph", "task", "task dependency"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pydantic[email]>=2",
    "pydantic-settings",
    "networkx",
    "aiohttp"
] # add all the dependencies here
dynamic = ["readme", "version"]

[project.urls]
Changelog = "https://github.com/Hochfrequenz/task-dependency-graph/releases"
Homepage = "https://github.com/Hochfrequenz/task-dependency-graph"

[dependency-groups]
tests = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "testcontainers",
    # "syrupy==4.8.2"
]
linting = [
    "ruff==0.16.4",
    {include-group = "tests"},
]
type_check = [
    "mypy==2.3.1",
    "types-docker",
    {include-group = "tests"},
]
spell_check = [
    "codespell==2.4.3"
]
coverage = [
    "coverage==7.15.4",
    {include-group = "tests"},
]
dev = [
    {include-group = "tests"},
    {include-group = "linting"},
    {include-group = "type_check"},
    {include-group = "coverage"},
    {include-group = "spell_check"},
]

[tool.uv]
default-groups = []

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "N", "PL", "RUF"]
ignore = [
    "PLR0913", # too-many-arguments
    "PLR0917", # too-many-positional-arguments
    "PLR0912", # too-many-branches
    "PLR0915", # too-many-statements
    "PLR2004", # magic-value-comparison
    "RUF001", # ambiguous-unicode-character-string
    "RUF002", # ambiguous-unicode-character-docstring
    "RUF003", # ambiguous-unicode-character-comment
]

[tool.ruff.lint.per-file-ignores]
"unittests/**" = ["N816"]
"src/taskdependencygraph/task_dependency_graph.py" = ["W605"]
"unittests/example_tdgs.py" = ["W605"]
"unittests/test_task_dependency_graph.py" = ["W605"]

[mypy]
truethy-bool = true

[tool.mypy]
disable_error_code = []

[build-system]
requires = ["hatchling>=1.8.0", "hatch-vcs", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"
fragments = [{ path = "README.md" }]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/_taskdependencygraph_version.py"
template = '''
version = "{version}"
'''

[tool.hatch.build.targets.sdist]
exclude = ["/unittests"]

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# markers = ["snapshot: mark a test as a snapshot test"]
